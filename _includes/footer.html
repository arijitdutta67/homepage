<footer class="site-footer">
  <div class="wrapper footer-strip">
    <nav class="footer-sitemap" aria-label="Sitemap">
      <span class="footer-label">Sitemap</span>
      <a class="page-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
      {% assign nav_pages = site.pages | where: "nav", true | sort: "nav_order" %}
      {% for nav_page in nav_pages %}
        <a class="page-link{% if page.url == nav_page.url %} active{% endif %}" href="{{ nav_page.url | relative_url }}">{{ nav_page.title | escape }}</a>
      {% endfor %}
    </nav>

    <div class="footer-social" aria-label="Social links">
      {% if site.linkedin_url %}
        <a class="social-link" href="{{ site.linkedin_url }}" aria-label="LinkedIn" title="LinkedIn">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.32 8.03h4.35V23H.32V8.03zM7.6 8.03h4.17v2.04h.06c.58-1.1 2-2.26 4.12-2.26 4.4 0 5.22 2.9 5.22 6.67V23h-4.35v-7.56c0-1.8-.03-4.12-2.51-4.12-2.52 0-2.9 1.97-2.9 4V23H7.6V8.03z"/>
          </svg>
        </a>
      {% endif %}

      {% if site.twitter_url %}
        <a class="social-link" href="{{ site.twitter_url }}" aria-label="X" title="X">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M18.9 2h3.68l-8.04 9.19L24 22h-7.42l-5.81-7.6L4.12 22H.44l8.6-9.83L0 2h7.6l5.25 6.94L18.9 2zm-1.29 18.1h2.04L6.49 3.8H4.3L17.61 20.1z"/>
          </svg>
        </a>
      {% endif %}

      {% if site.github_url %}
        <a class="social-link" href="{{ site.github_url }}" aria-label="GitHub" title="GitHub">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.34-1.29-1.69-1.29-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .98-.31 3.18 1.18.92-.26 1.91-.38 2.9-.39.98.01 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.69 5.4-5.25 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
          </svg>
        </a>
      {% endif %}
    </div>
  </div>
</footer>
