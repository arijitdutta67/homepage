<header class="site-header" role="banner">
  <div class="wrapper site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <span class="site-title__name">{{ site.title | escape }}</span>
      <span class="site-title__role">Applied cryptography and privacy</span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a class="page-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
      {% assign nav_pages = site.pages | where: "nav", true | sort: "nav_order" %}
      {% for nav_page in nav_pages %}
        <a class="page-link{% if page.url == nav_page.url %} active{% endif %}" href="{{ nav_page.url | relative_url }}">{{ nav_page.title | escape }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
