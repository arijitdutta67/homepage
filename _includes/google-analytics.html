{% assign ga_id = site.google_analytics | default: "" | strip %}
{% if jekyll.environment == "production" and ga_id != "" %}
  {% if ga_id contains "G-" %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id | uri_escape }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ ga_id }}');
    </script>
  {% else %}
    <!-- Google Analytics is disabled: use a GA4 Measurement ID that starts with G-. -->
  {% endif %}
{% endif %}
